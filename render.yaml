databases:
  - name: campusfolio-db
    databaseName: student_portfolio
    plan: free
    region: singapore

services:
  - type: web
    name: campusfolio-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server
    startCommand: npx prisma db push --schema=server/prisma/schema.prisma --accept-data-loss && node server/prisma/seed.js && node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
