databases:
  - name: campusfolio-db
    databaseName: student_portfolio
    plan: free
    region: singapore

services:
  - type: web
    name: campusfolio-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server && cd server && npx prisma generate
    startCommand: cd server && npx prisma db push --accept-data-loss && (node prisma/seed.js || true) && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
