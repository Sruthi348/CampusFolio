databases:
  - name: campusfolio-db
    databaseName: student_portfolio
    plan: free

services:
  - type: web
    name: campusfolio
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
