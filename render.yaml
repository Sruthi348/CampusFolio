databases:
  - name: campusfolio-db
    databaseName: student_portfolio
    plan: free
    region: singapore

services:
  - type: web
    name: campusfolio-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix client --legacy-peer-deps && npm --prefix client run build && npm install --prefix server && npx prisma generate --schema=server/prisma/schema.prisma
    startCommand: npx prisma db push --schema=server/prisma/schema.prisma --accept-data-loss && node server/prisma/seed.js && node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: campusfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
