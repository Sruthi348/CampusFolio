databases:
  - name: campusfolio-db
    databaseName: student_portfolio
    user: postgres
    plan: free

services:
  # Backend Express API Service
  - type: web
    name: campusfolio-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Frontend React (Vite) Static Site
  - type: web
    name: campusfolio-app
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusfolio-api
          property: host
